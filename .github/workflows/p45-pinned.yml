# Trial P-45 (software-factory, issue 251): an Action pinned one release back, for Dependabot to update. It runs
# only by hand, and no one runs it. It is granted nothing, holds no secret and keeps no credential.
name: trial-p45-pinned
on: workflow_dispatch
permissions: {}
jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
