# Platform trials P-1, P-7, P-24 and P-28 (combsmith/software-factory#24), and P-7.refused (#195): the machine user approves
# one pull request. Its token lives only in the environment main-only, which only main may deploy
# to and which waits for the Maintainer's click. The job prints only the review's id, state, commit
# and author, never the token. It runs only when dispatched, on main.
name: machine-user-approves
run-name: approve pull request ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull request to approve
        required: true
        type: number
      commit:
        description: The commit to approve, if not the head (P-7.refused)
        required: false
        type: string

permissions: {}

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main-only
    timeout-minutes: 5
    steps:
      - name: Approve, and print only the review's id, state, commit and author
        env:
          GH_TOKEN: ${{ secrets.DONPETRY_BOT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -- -f event=APPROVE
          [ -z "$COMMIT" ] || set -- "$@" -f commit_id="$COMMIT"
          gh api -X POST "repos/$GH_REPO/pulls/$PR/reviews" "$@" --jq '{id, state, commit_id, author: .user.login}'
