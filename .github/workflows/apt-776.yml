# combsmith/software-factory#776: the CLI's install with every ubuntu.com lookup stalled for a minute and then failing,
# by a local DNS stub that never answers an ubuntu.com name and forwards every other; the update unbounded, as on main,
# and bounded by `timeout 60`, as #776 proposes. Granted nothing, holds no secret, checks nothing out.
name: apt-776
on:
  pull_request:
    paths: ["apt-776/**"]
permissions: {}
jobs:
  unbounded:
    name: apt-776 / ubuntu.com stalled, update unbounded (main's block)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every ubuntu.com lookup stalls 60 s
        timeout-minutes: 3
        run: |
          printf '%s\n' 'import socket' 's = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.2", 53))' 'f = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); f.settimeout(5)' 'while True:' '    q, a = s.recvfrom(4096)' '    if b"\x06ubuntu\x03com\x00" in q.lower(): continue' '    f.sendto(q, ("127.0.0.53", 53))' '    try: s.sendto(f.recvfrom(4096)[0], a)' '    except OSError: pass' > /tmp/stall.py
          sudo nohup python3 /tmp/stall.py > /tmp/stall.log 2>&1 &
          sleep 1
          sudo sed -i 's/^hosts:.*/hosts: files dns/' /etc/nsswitch.conf
          sudo rm /etc/resolv.conf
          printf 'nameserver 127.0.0.2\noptions timeout:30 attempts:2\n' | sudo tee /etc/resolv.conf
          date -u +%T
          getent ahostsv4 mirrors.edge.kernel.org | head -1
          timeout 120 getent ahostsv4 azure.archive.ubuntu.com || echo "lookup ended $? at $(date -u +%T)"
      - name: Main's block, timed
        timeout-minutes: 10
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          echo "update ended at $(date -u +%T)"
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  bounded:
    name: apt-776 / ubuntu.com stalled, update bounded (the PR's block)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Every ubuntu.com lookup stalls 60 s
        timeout-minutes: 3
        run: |
          printf '%s\n' 'import socket' 's = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("127.0.0.2", 53))' 'f = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); f.settimeout(5)' 'while True:' '    q, a = s.recvfrom(4096)' '    if b"\x06ubuntu\x03com\x00" in q.lower(): continue' '    f.sendto(q, ("127.0.0.53", 53))' '    try: s.sendto(f.recvfrom(4096)[0], a)' '    except OSError: pass' > /tmp/stall.py
          sudo nohup python3 /tmp/stall.py > /tmp/stall.log 2>&1 &
          sleep 1
          sudo sed -i 's/^hosts:.*/hosts: files dns/' /etc/nsswitch.conf
          sudo rm /etc/resolv.conf
          printf 'nameserver 127.0.0.2\noptions timeout:30 attempts:2\n' | sudo tee /etc/resolv.conf
          date -u +%T
          getent ahostsv4 mirrors.edge.kernel.org | head -1
          timeout 120 getent ahostsv4 azure.archive.ubuntu.com || echo "lookup ended $? at $(date -u +%T)"
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo timeout 60 apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          echo "update ended at $(date -u +%T)"
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  both-up:
    name: apt-776 / both mirrors up (the PR's block)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo timeout 60 apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          echo "update ended at $(date -u +%T)"
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
