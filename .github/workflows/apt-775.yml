# combsmith/software-factory#774, PR 775: the update's `|| true` with one mirror answering a non-transient error, and
# ubuntu.com's DNS down with kernel.org up. Granted nothing, holds no secret, checks nothing out.
name: apt-775
on:
  pull_request:
    paths: ["apt-775/**"]
permissions: {}
jobs:
  both:
    name: apt-775 / both up
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  azure-tls:
    name: apt-775 / Azure's TLS fails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Azure's name at github.com's address
        run: |
          ip=$(getent ahostsv4 github.com | awk 'NR==1{print $1}')
          echo "$ip azure.archive.ubuntu.com" | sudo tee -a /etc/hosts
          curl -sS -o /dev/null https://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease || echo "curl exit $?"
      - name: Diagnostic update, its exit shown
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p /tmp/diag-lists/partial
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::State::Lists=/tmp/diag-lists -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10
          echo "update exit $?"
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  azure-404:
    name: apt-775 / Azure answers 404
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: A local https server answering 404 as azure.archive.ubuntu.com
        run: |
          mkdir -p /tmp/t /tmp/empty && cd /tmp/t
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=sf trial CA' -keyout ca.key -out ca.crt -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=azure.archive.ubuntu.com' -keyout leaf.key -out leaf.csr 2>/dev/null
          printf 'subjectAltName=DNS:azure.archive.ubuntu.com\nextendedKeyUsage=serverAuth\n' > ext
          openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile ext -out leaf.crt 2>/dev/null
          sudo cp ca.crt /usr/local/share/ca-certificates/sf-trial.crt && sudo update-ca-certificates >/dev/null
          echo '127.0.0.1 azure.archive.ubuntu.com' | sudo tee -a /etc/hosts
          cd /tmp/empty && sudo nohup python3 -c 'import http.server,ssl;s=http.server.HTTPServer(("127.0.0.1",443),http.server.SimpleHTTPRequestHandler);c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);c.load_cert_chain("/tmp/t/leaf.crt","/tmp/t/leaf.key");s.socket=c.wrap_socket(s.socket,server_side=True);s.serve_forever()' > /tmp/srv.log 2>&1 &
          sleep 2
          curl -sS -o /dev/null -w 'server answers %{http_code}\n' https://azure.archive.ubuntu.com/ubuntu/dists/noble/InRelease
      - name: Diagnostic update, its exit shown
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p /tmp/diag-lists/partial
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::State::Lists=/tmp/diag-lists -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10
          echo "update exit $?"
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  kernel-404:
    name: apt-775 / kernel.org answers 404
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: A local https server answering 404 as mirrors.edge.kernel.org
        run: |
          mkdir -p /tmp/t /tmp/empty && cd /tmp/t
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=sf trial CA' -keyout ca.key -out ca.crt -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=mirrors.edge.kernel.org' -keyout leaf.key -out leaf.csr 2>/dev/null
          printf 'subjectAltName=DNS:mirrors.edge.kernel.org\nextendedKeyUsage=serverAuth\n' > ext
          openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile ext -out leaf.crt 2>/dev/null
          sudo cp ca.crt /usr/local/share/ca-certificates/sf-trial.crt && sudo update-ca-certificates >/dev/null
          echo '127.0.0.1 mirrors.edge.kernel.org' | sudo tee -a /etc/hosts
          cd /tmp/empty && sudo nohup python3 -c 'import http.server,ssl;s=http.server.HTTPServer(("127.0.0.1",443),http.server.SimpleHTTPRequestHandler);c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);c.load_cert_chain("/tmp/t/leaf.crt","/tmp/t/leaf.key");s.socket=c.wrap_socket(s.socket,server_side=True);s.serve_forever()' > /tmp/srv.log 2>&1 &
          sleep 2
          curl -sS -o /dev/null -w 'server answers %{http_code}\n' https://mirrors.edge.kernel.org/ubuntu/dists/noble/InRelease
      - name: Diagnostic update, its exit shown
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p /tmp/diag-lists/partial
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::State::Lists=/tmp/diag-lists -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10
          echo "update exit $?"
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
  dns-down:
    name: apt-775 / ubuntu.com's DNS down, kernel.org up
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ubuntu.com's DNS queries dropped
        timeout-minutes: 2
        run: |
          sudo resolvectl flush-caches
          sudo iptables -I OUTPUT -p udp --dport 53 -m string --hex-string '|06|ubuntu|03|com|00|' --algo bm -j DROP
          sudo iptables -I OUTPUT -p tcp --dport 53 -m string --hex-string '|06|ubuntu|03|com|00|' --algo bm -j DROP
          date -u +%T
          timeout 60 getent hosts azure.archive.ubuntu.com || echo "lookup failed $(date -u +%T)"
          getent hosts github.com mirrors.edge.kernel.org
          curl -sS -o /dev/null -w 'kernel.org answers %{http_code}\n' https://mirrors.edge.kernel.org/ubuntu/dists/noble/InRelease
      - name: Diagnostic update, its exit shown
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p /tmp/diag-lists/partial
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::State::Lists=/tmp/diag-lists -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10
          echo "update exit $?"
      - name: The PR's block
        timeout-minutes: 3
        run: |
          date -u +%T
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://azure.archive.ubuntu.com/ubuntu noble-security main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-updates main' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirrors.edge.kernel.org/ubuntu noble-security main' > /tmp/ubuntu.list
          sudo apt-get update -q -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=0 -o Acquire::https::Timeout=10 || true
          sudo apt-get install -y --no-install-recommends -o Dir::Etc::sourcelist=/tmp/ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::https::Timeout=10 bubblewrap
          date -u +%T
          bwrap --version
