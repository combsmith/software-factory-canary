# Platform trial P-20 (combsmith/software-factory#187): does an event anyone may cause, starring this repo, start a
# workflow, and how soon? It runs when the repo is starred, holds no permission, reads no secret, and its one step
# prints the time. Its run records, read afterwards, are the measurement.
name: p20-watch

on:
  watch:
    types:
      - started

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: date -u +%Y-%m-%dT%H:%M:%SZ
