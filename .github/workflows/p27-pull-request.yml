# Platform trial P-27 (combsmith/software-factory#187): does a fork's pull-request run wait for approval? This
# workflow runs on every pull request to this repo, holds no permission, reads no secret, and its one step prints a
# line. Its run records for a fork's pull request, read afterwards, are the measurement.
name: p27-pull-request

on:
  pull_request:

permissions: {}

jobs:
  note:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "a pull request's run"
