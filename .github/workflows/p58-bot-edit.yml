# Platform trial P-58 (combsmith/software-factory#519): a bot's edit of a pull request's description, by this job's
# GITHUB_TOKEN, when the label p58-bot-edit is added. It prints nothing of the token.
name: p58-bot-edit
on:
  pull_request:
    types: [labeled]
permissions: {}
jobs:
  edit:
    if: github.event.label.name == 'p58-bot-edit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Add a line to the description, as the workflow's bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$GH_REPO/pulls/$NUMBER" --jq .body)
          printf '%s\n\nA line the workflow added, as its bot.\n' "$body" > body.txt
          gh api -X PATCH "repos/$GH_REPO/pulls/$NUMBER" -F body=@body.txt --jq '{number, updated_at}'
