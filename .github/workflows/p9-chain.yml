# Platform trial P-9 (combsmith/software-factory#187): can a pass start the next one with the default workflow token?
# It runs only when dispatched, on the branch it is dispatched on, with actions: write and nothing else, and reads no secret. At depth 1 its one
# job dispatches this workflow once more, at depth 2 on its own ref, with its own GITHUB_TOKEN; at depth 2 it dispatches nothing, so
# the chain stops at two. The dispatch's answer is redacted inside the job by tools/redact_trial.py of
# combsmith/software-factory, checked out at a pinned commit, before it is uploaded.
name: p9-chain
run-name: p9 chain, depth ${{ inputs.depth }}

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 1 starts the chain and dispatches depth 2; 2 dispatches nothing
        required: true
        type: string

permissions:
  actions: write

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: combsmith/software-factory
          ref: 1af2d69d3a961606e7857db9d2946d5d0328d761
          path: sf
          persist-credentials: false
      - name: Record the time and, at depth 1, dispatch depth 2 with the job's own token
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ inputs.depth }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -eu
          mkdir out
          date -u +%Y-%m-%dT%H:%M:%SZ > out/started_at.txt
          echo "$RUN_ID" > out/run_id.txt
          echo "$DEPTH" > out/depth.txt
          if [ "$DEPTH" = "1" ]; then
            printf '{"ref":"%s","inputs":{"depth":"2"}}' "$GITHUB_REF_NAME" > out/dispatch.json
            curl -sS -i -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              --data-binary @out/dispatch.json \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/p9-chain.yml/dispatches" > out/dispatch.raw || true
            (cd sf && python3 -m tools.redact_trial ../out/dispatch.raw ../out/dispatch.clean)
            rm -f out/dispatch.raw
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p9-out-${{ inputs.depth }}
          path: out
